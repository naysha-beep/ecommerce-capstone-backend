<!-- Creatimg a self adding list button -->
<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <style>
            body{
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #container{
                background-color:aliceblue;

            }

            &:active{
                transform: scale(0.9);
            }
            input{
                font-size: 2rem;
                padding: 10px;
                margin-bottom: 1rem;
                border: solid blanchedalmond;
            }
            #btncontainer{
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap:5px;
                font-size: 1.5 rem;
                cursor:pointer;

            }
        </style>
    </head>
    <body>
        <div id="container">

        <button>Ac</button>
        <button>DLT</button>
        <button>/</button>
        <button>*</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>-</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>+</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>%</button>
        <button>00</button>
        <button>.</button>
        <button>=</button>
        </div>

          
   
        
        <script>
        let inp=document.querySelector('input')
        let btn=document.querySelector('#btnContainer')
        let arr=["AC","DLT","/","*","-",]
        function calc(event){
            if(arr.includes)
            inp.value+=event.target.innerText
        }
        btn.addEventListener('click',calc)

           
        </script>
    </body>
</html>
